<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #fbf5ee;
      font-family: Arial, Helvetica, sans-serif;
      color: #1b1714;
    "
  >
    <div style="max-width: 480px; margin: 0 auto; background: #fffdf9; border-radius: 16px; padding: 28px">
      <p style="margin: 0 0 4px; font-size: 16px; color: #5c5149">Covenant Culture 40 Days</p>
      <h1 style="margin: 0 0 16px; font-size: 24px">Your sign-in code</h1>
      <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.5">
        Enter this code in the app to continue:
      </p>
      <p style="margin: 0 0 20px; font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #bc4b16">
        {{ .Token }}
      </p>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5c5149">
        It works for one hour. If you didn't ask for it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
